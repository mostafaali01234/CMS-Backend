name: CMS Backend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  # ==========================================
  # Job 1: CI
  # ==========================================
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore CMS-Backend.sln

      - name: Build solution
        run: dotnet build CMS-Backend.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CMS-Backend.sln --configuration Release --no-build


  # ==========================================
  # Job 2: Docker Build and Push
  # ==========================================
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mostafaali01234/cms-backend:latest
            ghcr.io/mostafaali01234/cms-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max