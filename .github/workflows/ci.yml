
name: CMS Backend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore CMS-Backend.sln

      - name: Build solution
        run: dotnet build CMS-Backend.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CMS-Backend.sln --configuration Release --no-build

      - name: Build Docker image
        run: docker build -t cms-api:${{ github.sha }} .
